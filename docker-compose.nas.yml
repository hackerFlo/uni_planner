services:
  server:
    image: ghcr.io/hackerflo/uni-planner-server:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DATABASE_PATH: /app/data/planner.db
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      NOTIFICATION_ENCRYPT_KEY: ${NOTIFICATION_ENCRYPT_KEY}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # Settings > App Updates. Unset either one and that section says it is not
      # configured rather than failing. GITHUB_REPO carries no default here on
      # purpose: which repository a deployment tracks is environment, not source.
      GITHUB_REPO: ${GITHUB_REPO:-}
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}
    volumes:
      # A bind mount, not a named volume. Docker keeps named volumes under
      # /volume1/@docker on DSM, which is hidden from File Station and excluded
      # from Hyper Backup -- the database would sit there unbacked-up forever.
      # Resolved against this file's directory, so on the NAS it is
      # /volume1/docker/uni_planner/data. Must be owned by uid 1000 (see Dockerfile).
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  client:
    image: ghcr.io/hackerflo/uni-planner-client:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8080:80"
    depends_on:
      - server
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
      # Lets the server trigger an update on demand (POST /api/version/update).
      # The API listens on the compose network only -- deliberately no ports:
      # entry, so nothing is reachable from the host or the LAN.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      # Set WATCHTOWER_TOKEN in .env before deploying: with the API enabled an
      # empty token is not usable. The server service reads the same variable,
      # so the two ends cannot drift apart.
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      # NOT OPTIONAL. Enabling the HTTP API otherwise puts Watchtower in
      # API-only mode: WATCHTOWER_SCHEDULE above stops running and the nightly
      # 04:00 update silently never happens again. Removing this line looks like
      # a tidy-up and is the easiest way to break this deployment.
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
