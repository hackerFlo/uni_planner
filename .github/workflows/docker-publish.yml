name: Build and push Docker images

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Keep registry publication in BuildKit: a separate `docker push` has
      # intermittently failed against GHCR with "unknown blob". The local load
      # below is only for smoke testing; publication reuses this builder's cache.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=${{ github.sha }}
          echo "SERVER_IMAGE=ghcr.io/${OWNER}/uni-planner-server" >> $GITHUB_ENV
          echo "CLIENT_IMAGE=ghcr.io/${OWNER}/uni-planner-client" >> $GITHUB_ENV
          echo "SHA_TAG=${SHA::7}" >> $GITHUB_ENV
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Build client for container smoke
        uses: docker/build-push-action@v6
        with:
          context: ./client
          load: true
          no-cache: true
          provenance: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_COMMIT=${{ env.SHA_TAG }}
          tags: ${{ env.CLIENT_IMAGE }}:${{ env.SHA_TAG }}

      # A frontend bundle can build successfully while nginx fails at startup.
      # This gate must pass before either production image is published.
      - name: Smoke built client container
        run: bash scripts/smoke-client-container.sh "${CLIENT_IMAGE}:${SHA_TAG}"

      - name: Build server for container smoke
        uses: docker/build-push-action@v6
        with:
          context: ./server
          load: true
          no-cache: true
          provenance: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_COMMIT=${{ env.SHA_TAG }}
          tags: ${{ env.SERVER_IMAGE }}:${{ env.SHA_TAG }}

      - name: Smoke built server container
        run: bash scripts/smoke-server-container.sh "${SERVER_IMAGE}:${SHA_TAG}"

      - name: Publish smoke-tested server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_COMMIT=${{ env.SHA_TAG }}
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ env.SHA_TAG }}

      - name: Publish smoke-tested client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_COMMIT=${{ env.SHA_TAG }}
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ env.SHA_TAG }}
