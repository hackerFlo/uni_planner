# Cloudflare/Synology terminate TLS and forward over plain HTTP, so $scheme is
# always "http" here. Preserve the edge's X-Forwarded-Proto when it sent one,
# otherwise fall back to the scheme of a direct LAN hit.
# Normalised to a bare lowercase literal: an edge may send "HTTPS", or a chain
# of proxies may send "https, http". Express compares req.protocol === 'https'
# exactly, so anything else silently costs the cookie its Secure flag.
map $http_x_forwarded_proto $forwarded_proto {
    default                 $scheme;
    "~*^\s*https\s*(,|$)"   https;
    "~*^\s*http\s*(,|$)"    http;
}

# Only three files in the build have stable URLs, and between them they decide
# whether a deploy is ever seen: index.html, sw.js and registerSW.js. ".js" is on
# Cloudflare's default cacheable-extension list, so with no Cache-Control of our
# own the edge is free to hold a stale /sw.js -- and a stale service worker keeps
# serving the previous bundle out of its own precache, because it answers every
# navigation from there rather than from nginx. That is how a deployed update
# stays invisible for days. Everything under /assets/ is content-hashed by Vite,
# so it is the one thing safe to cache forever.
map $uri $cache_control {
    default     "no-cache";                              # store, but always revalidate
    ~^/api/     "";                                      # Express sends its own no-store
    ~^/assets/  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $cache_control always;

    location /api/backup/restore {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  5m;
    }

    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        client_max_body_size  10k;
    }

    # A stale index.html naming a hashed chunk that no longer exists must get a
    # 404, not index.html with a 200 -- the browser would parse HTML as
    # JavaScript and the app would die with nothing useful in the console.
    # No add_header here, so the five security headers are still inherited.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
