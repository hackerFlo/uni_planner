# Cloudflare/Synology terminate TLS and forward over plain HTTP, so $scheme is
# always "http" here. Preserve the edge's X-Forwarded-Proto when it sent one,
# otherwise fall back to the scheme of a direct LAN hit.
# Normalised to a bare lowercase literal: an edge may send "HTTPS", or a chain
# of proxies may send "https, http". Express compares req.protocol === 'https'
# exactly, so anything else silently costs the cookie its Secure flag.
map $http_x_forwarded_proto $forwarded_proto {
    default                 $scheme;
    "~*^\s*https\s*(,|$)"   https;
    "~*^\s*http\s*(,|$)"    http;
}

# Only three files in the build have stable URLs, and between them they decide
# whether a deploy is ever seen: index.html, sw.js and registerSW.js. ".js" is on
# Cloudflare's default cacheable-extension list, so with no Cache-Control of our
# own the edge is free to hold a stale /sw.js -- and a stale service worker keeps
# serving the previous bundle out of its own precache, because it answers every
# navigation from there rather than from nginx. That is how a deployed update
# stays invisible for days. Everything under /assets/ is content-hashed by Vite,
# so it is the one thing safe to cache forever.
map $uri $cache_control {
    default     "no-cache";                              # store, but always revalidate
    ~^/api/     "";                                      # Express sends its own no-store
    ~^/mcp      "no-store";
    ~^/assets/  "public, max-age=31536000, immutable";
}

# The dedicated Access policy must never expose website APIs or SPA files.
# Match the original URI: nginx normalizes encoded paths before location lookup.
map_hash_bucket_size 512;
map $host $is_mcp_host {
    default 0;
    "${MCP_HOST}" 1;
}
map $request_uri $is_mcp_path {
    default 0;
    ~^/mcp(?:\?.*)?$ 1;
}
map "$is_mcp_host:$is_mcp_path" $reject_mcp_path {
    default 0;
    "1:0" 1;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $cache_control always;

    if ($reject_mcp_path) { return 404; }

    location = /mcp {
        if ($is_mcp_host = 0) { return 404; }
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        client_body_timeout 15s;
        client_max_body_size 1m;
    }

    location /api/backup/restore {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  5m;
    }

    # A quotes CSV is far bigger than the 10k the general /api/ block allows --
    # the shipped seed file alone is ~25 kB. Mirrors the restore block above and
    # must stay in step with the route-level express.json() in
    # server/routes/quotes.js and the exempt list in middleware/bodyParser.js;
    # if the three disagree the upload fails at whichever limit is smallest.
    #
    # AR-14(a): this block deliberately declares NO add_header. Adding even one
    # here would drop every inherited security header, the CSP included.
    location /api/quotes/import {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  1m;
    }

    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        client_max_body_size  10k;
    }

    # A stale index.html naming a hashed chunk that no longer exists must get a
    # 404, not index.html with a 200 -- the browser would parse HTML as
    # JavaScript and the app would die with nothing useful in the console.
    # No add_header here, so the five security headers are still inherited.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
