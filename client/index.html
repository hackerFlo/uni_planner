<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No user-scalable/maximum-scale: blocking pinch-zoom is a WCAG 1.4.4 failure.
         Desktop zoom is still suppressed from App.jsx's keydown/wheel handler, which
         touch pinch never triggers -- so the two do not conflict. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uni Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Uni Planner" />
    <meta name="theme-color" content="#6366f1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
